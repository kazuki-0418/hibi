name: Hibi Orchestrator

on:
  push:
    branches: [main]
    paths:
      - "service/**"
      - ".github/workflows/build-and-push.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/orchestrator.yml"
  # Manual rerun (e.g. after rolling back homelab or rotating Sentry DSN).
  workflow_dispatch:

# Only one deploy at a time; cancel earlier in-flight runs targeting the
# same ref so a quick succession of merges does not interleave.
concurrency:
  group: hibi-prod-${{ github.ref }}
  cancel-in-progress: true

# Reusable workflows can only narrow the parent's permission set, so the
# orchestrator must grant the union of what its children need. The deploy
# job runs on a self-hosted runner and uses nothing from GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build-and-push.yml
    secrets: inherit

  deploy:
    needs: build
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
      image_ref: ${{ needs.build.outputs.image_ref }}
      commit_sha: ${{ github.sha }}
    secrets: inherit
