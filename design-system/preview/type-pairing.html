<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Type pairing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:40px 48px;background:var(--bg-primary);}
  .eyebrow{font-family:var(--font-en);font-size:12px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;}
  .h{font-family:var(--font-jp);font-size:56px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;color:var(--text-primary);margin:0 0 20px;}
  .body{font-family:var(--font-jp);font-size:18px;line-height:1.7;color:var(--text-secondary);max-width:560px;}
  .rule{width:48px;height:1px;background:var(--text-primary);margin:0 0 18px;}
  .stamp{font-family:var(--font-en);font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:0.2em;color:var(--text-muted);margin-top:28px;}
</style></head>
<body>
  <div class="rule"></div>
  <div class="eyebrow">No. 0142 — 2026.05.10</div>
  <h1 class="h">朝のニュース、五本だけ。</h1>
  <p class="body">Hibi は毎朝、技術系チャンネルとフィードから五本を選び、Claude が日本語で要約して届ける。読み終わるまで三分。</p>
  <div class="stamp">HIBI · DAILY · TOKYO</div>
</body></html>
