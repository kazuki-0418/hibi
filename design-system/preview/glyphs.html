<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Glyphs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:36px 40px;background:var(--bg-primary);font-family:var(--font-jp);}
  .lab{font-family:var(--font-en);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:20px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;}
  .g{display:flex;flex-direction:column;align-items:center;border:1px solid var(--border);padding:18px 8px 12px;}
  .ch{font-size:36px;color:var(--text-primary);line-height:1;margin-bottom:14px;font-family:var(--font-jp-serif);}
  .nm{font-family:var(--font-en);font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);}
</style></head>
<body>
  <div class="lab">Unicode glyphs — no emoji, no icon font</div>
  <div class="grid">
    <div class="g"><div class="ch">・</div><div class="nm">middot</div></div>
    <div class="g"><div class="ch">—</div><div class="nm">em-dash</div></div>
    <div class="g"><div class="ch">→</div><div class="nm">arrow</div></div>
    <div class="g"><div class="ch">↗</div><div class="nm">external</div></div>
    <div class="g"><div class="ch">§</div><div class="nm">section</div></div>
    <div class="g"><div class="ch">№</div><div class="nm">numero</div></div>
  </div>
</body></html>
