<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Motion principles</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:36px 40px;background:var(--bg-primary);font-family:var(--font-jp);}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:32px;}
  .lab{font-family:var(--font-en);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;}
  .val{font-family:var(--font-en);font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:0.05em;color:var(--text-primary);}
  .desc{font-size:13px;line-height:1.6;color:var(--text-secondary);margin-top:8px;}
  .ttl{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:6px;}
  .col{border-top:1px solid var(--text-primary);padding-top:14px;}
</style></head>
<body>
<div class="grid">
  <div class="col">
    <div class="lab">Hover · links</div>
    <div class="ttl">opacity 1 → 0.55</div>
    <div class="val">120ms · ease-out</div>
    <div class="desc">下線は維持。色は変えない。</div>
  </div>
  <div class="col">
    <div class="lab">Press</div>
    <div class="ttl">no scale</div>
    <div class="val">60ms · hold @ 0.7</div>
    <div class="desc">縮小もバウンスも禁止。</div>
  </div>
  <div class="col">
    <div class="lab">Page enter</div>
    <div class="ttl">fade up 12px</div>
    <div class="val">480ms · ease-out</div>
    <div class="desc">入場のみ。ヒーロー演出なし。</div>
  </div>
</div>
</body></html>
