<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Article card</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px 40px;background:var(--bg-primary);}
  .card{border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:24px 0;display:grid;grid-template-columns:48px 1fr 80px;column-gap:24px;}
  .num{font-family:var(--font-en);font-variant-numeric:tabular-nums;font-size:32px;font-weight:500;color:var(--text-primary);line-height:1;}
  .body h3{font-family:var(--font-jp);font-size:22px;font-weight:700;line-height:1.3;margin:0 0 10px;color:var(--text-primary);}
  .meta{font-family:var(--font-en);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;}
  .lede{font-family:var(--font-jp);font-size:15px;line-height:1.7;color:var(--text-secondary);margin:0;}
  .src{font-family:var(--font-en);font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-muted);text-align:right;line-height:1.5;}
  .src strong{color:var(--text-primary);font-weight:500;}
</style></head>
<body>
<article class="card">
  <div class="num">02</div>
  <div class="body">
    <div class="meta">AI · 3 min read</div>
    <h3>Anthropic、Claude 4.6 をリリース</h3>
    <p class="lede">長文要約とコード生成の精度が向上。既存 API キーで即時利用可能。バッチ処理 API も同時にベータ提供開始。</p>
  </div>
  <div class="src"><strong>Anthropic</strong><br>YouTube<br>2026.05.09</div>
</article>
</body></html>
