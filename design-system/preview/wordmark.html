<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;height:100%;background:var(--bg-primary);}
  .frame{display:flex;align-items:center;justify-content:center;height:300px;padding:40px;}
  .mark{font-family:var(--font-jp-serif);font-weight:700;font-size:140px;line-height:1;color:var(--text-primary);letter-spacing:-0.02em;}
  .side{margin-left:40px;border-left:1px solid var(--border);padding-left:32px;}
  .eyebrow{font-family:var(--font-en);font-size:11px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;}
  .sub{font-family:var(--font-jp);font-size:14px;color:var(--text-secondary);}
  .num{font-family:var(--font-en);font-variant-numeric:tabular-nums;letter-spacing:0.2em;font-size:12px;color:var(--text-muted);margin-top:14px;}
</style></head>
<body><div class="frame">
  <div class="mark">日々</div>
  <div class="side">
    <div class="eyebrow">Hibi · Daily</div>
    <div class="sub">日々の小さな知らせ</div>
    <div class="num">EST. 2026 · NO. 0001</div>
  </div>
</div></body></html>
