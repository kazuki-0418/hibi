<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Eyebrow & datestamp</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:40px 48px;background:var(--bg-primary);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;}
  .lab{font-family:var(--font-en);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px;}
  .eb{font-family:var(--font-en);font-size:13px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;color:var(--text-muted);}
  .ds{font-family:var(--font-en);font-variant-numeric:tabular-nums;letter-spacing:0.2em;font-size:14px;color:var(--text-muted);margin-top:8px;}
  .h{font-family:var(--font-jp);font-size:36px;font-weight:700;line-height:1.15;letter-spacing:-0.02em;margin:10px 0 0;}
  .num{font-family:var(--font-en);font-variant-numeric:tabular-nums;font-size:64px;font-weight:500;letter-spacing:0;color:var(--text-primary);line-height:1;}
  .num-row{display:flex;align-items:baseline;gap:14px;}
  .num-sub{font-family:var(--font-en);font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);}
</style></head>
<body>
<div class="grid">
  <div>
    <div class="lab">Eyebrow + heading</div>
    <div class="eb">Issue · No. 0142</div>
    <h2 class="h">今朝の5本</h2>
  </div>
  <div>
    <div class="lab">Datestamp</div>
    <div class="num-row">
      <div class="num">2026.05.10</div>
    </div>
    <div class="ds">MON · 06:00 JST · 5 STORIES</div>
  </div>
</div>
</body></html>
